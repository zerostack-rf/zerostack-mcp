# mcp-name: io.github.zerostack-rf/zerostack-mcp
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zerostack-mcp"
version = "0.9.10"
description = "MCP server for diagnosing Zigbee, Thread, and IEEE 802.15.4 logs, decoding TI SimpleLink F2 and Silicon Labs EFR32 registers, and querying SMLIGHT ZeroStack benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

authors = [
    { name = "ZeroStack RF Engineering", email = "engineering@smlight.tech" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "zigbee",
    "zigbee2mqtt",
    "zha",
    "openthread",
    "ieee-802-15-4",
    "cc2652",
    "cc1352",
    "cc2674",
    "slzb-06",
    "smlight",
    "zerostack",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://smlight.tech/software/zerostack"
Documentation = "https://github.com/smlight-tech/zerostack"
WebAnalyzer = "https://smlight.tech.github.io/zerostack/"
Repository = "https://github.com/zerostack-rf/zerostack-mcp"
Issues = "https://github.com/zerostack-rf/zerostack-mcp/issues"

[project.scripts]
zerostack-mcp = "zerostack_mcp.server:main"

[dependency-groups]
dev = [
    "jsonschema>=4.19.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "types-jsonschema>=4.19.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zerostack_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false